name: Patch platform admin async boundary

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-platform-admin-async-boundary.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded async-boundary patch
        run: node tools/patch-platform-admin-async-boundary.mjs
      - name: Verify syntax and admin boundary tests
        run: |
          node --check v2/platform-admin-overlay.js
          node tests/platform-admin-employer-usage-logic-audit.mjs
          node tests/platform-admin-overlay-runtime-audit.mjs
      - name: Commit patched Worker and regression test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/platform-admin-overlay.js tests/platform-admin-overlay-runtime-audit.mjs
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'Fix platform admin async error boundary'
          git push origin HEAD:main
