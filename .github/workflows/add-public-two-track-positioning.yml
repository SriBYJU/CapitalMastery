name: Add public two-track positioning

on:
  push:
    branches: [main]
    paths:
      - 'tools/add-public-two-track-positioning.mjs'
      - '.github/workflows/add-public-two-track-positioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add public two-track positioning
        run: node tools/add-public-two-track-positioning.mjs
      - name: Syntax validation
        run: node --check training-tracks.js
      - name: Focused audits
        run: |
          node tests/public-two-track-positioning-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/track-upgrade-no-repeat-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Build and verify Pages artifact
        run: |
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-tracks.js training-tracks.css
          git commit -m 'Make two program levels obvious on public surfaces'
          git push origin HEAD:main
