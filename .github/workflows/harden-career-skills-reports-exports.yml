name: Harden Career Skills reports and exports

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden-career-skills-reports-exports.mjs'
      - '.github/workflows/harden-career-skills-reports-exports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Career Skills report/export hardening
        run: node tools/harden-career-skills-reports-exports.mjs
      - name: Syntax validation
        run: |
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
      - name: Focused audits
        run: |
          node tests/career-skills-report-export-audit.mjs
          node tests/career-skills-track-audit.mjs
          node tests/two-track-consistency-audit.mjs
          node tests/two-track-notification-reporting-audit.mjs
          node tests/employer-operations-audit.mjs
          node tests/enterprise-least-privilege-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Build and verify Pages artifact
        run: |
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enterprise-v2.js v2/worker-v2-phase1-release.js
          git commit -m 'Make Career Skills reports and exports program-aware'
          git push origin HEAD:main
