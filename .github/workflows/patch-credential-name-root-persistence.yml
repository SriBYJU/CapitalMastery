name: Apply credential-name root persistence repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-credential-name-root-persistence.yml'
      - 'tools/patch-credential-name-root-persistence.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: node tools/patch-credential-name-root-persistence.mjs
      - name: Validate repaired source
        run: |
          set -euo pipefail
          node --check certificate-name.js
          node --check firebase-sync.js
          node --check firebase-auth.js
          node tests/deployable-encoding-audit.mjs
          grep -q "credentialNameConfirmed: true" certificate-name.js
          grep -q "Credential identity is authoritative on the protected user-root document" certificate-name.js
          grep -q "progress sync preserves confirmed root identity" tools/patch-credential-name-root-persistence.mjs
          grep -q "base.credentialNameConfirmed = true" firebase-sync.js
          git diff --exit-code -- . ':!certificate-name.js' ':!firebase-sync.js'
      - name: Commit product repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add certificate-name.js firebase-sync.js
          git diff --cached --quiet && { echo 'No patch needed'; exit 0; }
          git commit -m 'Make credential-name confirmation durable'
          git push origin HEAD:main
