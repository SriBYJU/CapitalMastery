name: Patch completed quiz review

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-completed-quiz-review.mjs'
      - 'tests/completed-quiz-review-audit.mjs'
      - '.github/workflows/patch-completed-quiz-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded quiz review repair
        run: node tools/patch-completed-quiz-review.mjs

      - name: Validate repaired contract
        run: |
          set -euo pipefail
          node --check app.js
          node tests/completed-quiz-review-audit.mjs
          node tests/state-resilience-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Commit product repair only
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js; then
            echo 'No app.js change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Preserve completed quiz review state'
          git push
