name: Harden track notifications and reporting

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden-track-notifications-reporting.mjs'
      - 'tools/fix-track-attention-regression.mjs'
      - '.github/workflows/harden-track-notifications-reporting.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply program-aware notification and reporting hardening
        run: |
          node tools/harden-track-notifications-reporting.mjs
          node tools/fix-track-attention-regression.mjs
      - name: Syntax checks
        run: |
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
      - name: Focused audits
        run: |
          node tests/two-track-notification-reporting-audit.mjs
          node tests/two-track-consistency-audit.mjs
          node tests/assigned-program-status-audit.mjs
          node tests/notification-discovery-audit.mjs
          node tests/employer-operations-audit.mjs
          node tests/employer-firm-ready-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit hardened sources
        run: |
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enterprise-v2.js v2/worker-v2-phase1-release.js
          git commit -m 'Make notifications and employer signals program-aware'
          git push origin HEAD:main
