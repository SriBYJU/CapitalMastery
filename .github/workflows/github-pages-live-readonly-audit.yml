name: GitHub Pages live read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-pages-live-readonly-audit.yml'
      - '_config.yml'
      - 'tools/build-pages.mjs'
      - 'capital-mastery-live.js'
      - 'capital-mastery-live-ui.js'
      - 'app.js'
      - 'admin-route-guard.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FALLBACK: https://sribyju.github.io/CapitalMastery
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this source generation on GitHub Pages
        run: |
          set -euo pipefail
          ready=false
          for i in {1..60}; do
            curl -fsS "${FALLBACK}/capital-mastery-live.js?sha=${GITHUB_SHA}" -o /tmp/cm-live.js || true
            curl -fsS "${FALLBACK}/app.js?sha=${GITHUB_SHA}" -o /tmp/cm-app.js || true
            if grep -q 'PROGRAM COMPLETIONS' /tmp/cm-live.js 2>/dev/null && grep -q "root==='admin-preview'&&a==='simulation'" /tmp/cm-app.js 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'GitHub Pages did not converge to the current protected/completion-aware generation'; exit 1; }
          echo 'GitHub Pages current-generation markers: PASS'

      - name: Prove internal backend and QA artifacts are not public
        run: |
          set -euo pipefail
          exposed=0
          check_private() {
            path="$1"
            code=$(curl -sS -o /tmp/cm-private-check -w '%{http_code}' "${FALLBACK}/${path}?sha=${GITHUB_SHA}" || true)
            case "$code" in
              404|403) echo "PRIVATE $path -> HTTP $code" ;;
              *) echo "CRITICAL EXPOSURE: $path -> HTTP $code"; exposed=1 ;;
            esac
          }
          check_private 'v2/worker-v2-phase1-release.js'
          check_private 'migrations/017_phase2_program_completion_records.sql'
          check_private 'tests/program-completion-public-verification-audit.mjs'
          check_private 'tools/prepare-production-d1.mjs'
          check_private 'wrangler.jsonc'
          check_private 'auth-test.html'
          check_private 'dist-pages-sha256.txt'
          [ "$exposed" -eq 0 ] || exit 1
          echo 'GitHub Pages internal-artifact exposure boundary: PASS'

      - name: Public route and asset smoke
        run: |
          set -euo pipefail
          curl -fsS "${FALLBACK}/" -o /tmp/cm-index
          grep -q 'admin-route-guard.js' /tmp/cm-index
          grep -q 'capital-mastery-live.js' /tmp/cm-index
          grep -q 'public-certificate-verify.js' /tmp/cm-index
          curl -fsS "${FALLBACK}/assets/logo-mark.svg" >/dev/null
          echo 'GitHub Pages public shell/assets: PASS'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Live public browser matrix
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${FALLBACK}/" node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL="${FALLBACK}/" node tests/admin-simulation-route-stability-browser-audit.cjs
          CM_AUDIT_URL="${FALLBACK}/" node tests/program-completion-public-browser-audit.cjs
          CM_AUDIT_URL="${FALLBACK}/" node tests/learner-guide-mobile-browser-audit.cjs
          CM_AUDIT_URL="${FALLBACK}/" node tests/all-career-browser-sweep.cjs
          CM_AUDIT_URL="${FALLBACK}/" node tests/employer-public-browser-audit.cjs
