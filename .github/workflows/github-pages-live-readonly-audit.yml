name: GitHub Pages live read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-pages-live-readonly-audit.yml'
      - '*.js'
      - '*.css'
      - '*.html'
      - '*.webmanifest'
      - '*.txt'
      - '*.xml'
      - '_config.yml'
      - 'assets/**'
      - 'tests/**'
      - 'tools/build-pages.mjs'
      - 'migrations/**'
      - 'v2/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIMARY: https://sribyju.github.io/CapitalMastery
    steps:
      - uses: actions/checkout@v4

      - name: Wait for current protected/completion/identity-aware generation
        run: |
          set -euo pipefail
          ready=false
          for i in {1..60}; do
            curl -fsS "${PRIMARY}/capital-mastery-live.js?sha=${GITHUB_SHA}" -o /tmp/cm-live.js || true
            curl -fsS "${PRIMARY}/app.js?sha=${GITHUB_SHA}" -o /tmp/cm-app.js || true
            curl -fsS "${PRIMARY}/certificate-name.js?sha=${GITHUB_SHA}" -o /tmp/cm-name.js || true
            if grep -q 'PROGRAM COMPLETIONS' /tmp/cm-live.js 2>/dev/null \
              && grep -q "root==='admin-preview'&&a==='simulation'" /tmp/cm-app.js 2>/dev/null \
              && grep -q 'Credential identity is authoritative on the protected user-root document' /tmp/cm-name.js 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'GitHub Pages did not converge to the protected/completion/identity-aware generation'; exit 1; }
          echo 'GitHub Pages current-generation markers: PASS'

      - name: Wait for internal backend and QA artifacts to become private
        run: |
          set -euo pipefail
          paths=(
            'v2/worker-v2-phase1-release.js'
            'migrations/017_phase2_program_completion_records.sql'
            'migrations/018_assessment_attempt_reviews.sql'
            'tests/program-completion-public-verification-audit.mjs'
            'tools/prepare-production-d1.mjs'
            'wrangler.jsonc'
            'auth-test.html'
            'firestore.rules'
            'firebase-config.example.js'
          )
          private=false
          for attempt in {1..60}; do
            exposed=0
            for path in "${paths[@]}"; do
              code=$(curl -sS -o /tmp/cm-private-check -w '%{http_code}' "${PRIMARY}/${path}?sha=${GITHUB_SHA}&attempt=${attempt}" || true)
              case "$code" in
                404|403) ;;
                *) exposed=1 ;;
              esac
            done
            if [ "$exposed" -eq 0 ]; then private=true; break; fi
            sleep 5
          done
          [ "$private" = true ] || {
            echo 'GitHub Pages still exposes one or more internal artifacts after propagation window'
            for path in "${paths[@]}"; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "${PRIMARY}/${path}?final=${GITHUB_SHA}" || true)
              echo "$path -> HTTP $code"
            done
            exit 1
          }
          for path in "${paths[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${PRIMARY}/${path}?final=${GITHUB_SHA}" || true)
            echo "PRIVATE $path -> HTTP $code"
          done
          echo 'GitHub Pages internal-artifact exposure boundary: PASS'

      - name: Public route and asset smoke
        run: |
          set -euo pipefail
          curl -fsS "${PRIMARY}/" -o /tmp/cm-index
          grep -q 'admin-route-guard.js' /tmp/cm-index
          grep -q 'capital-mastery-live.js' /tmp/cm-index
          grep -q 'public-certificate-verify.js' /tmp/cm-index
          grep -q 'certificate-name.js' /tmp/cm-index
          curl -fsS "${PRIMARY}/assets/logo-mark.svg" >/dev/null
          echo 'GitHub Pages public shell/assets: PASS'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Live public browser matrix
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY}/" node tests/state-resilience-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/course-assessment-state-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/course-pass-continuity-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/legacy-simulation-refusal-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/ib-workbench-navigation-guide-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/v2-assessment-review-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/failure-seeking-browser-audit.mjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/adversarial-chaos-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/admin-simulation-route-stability-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/program-completion-public-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/learner-guide-mobile-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/all-career-browser-sweep.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/employer-invite-lifecycle-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY}/" node tests/visual-contrast-browser-audit.cjs
          echo 'GitHub Pages seventeen-suite live browser matrix: PASS'
