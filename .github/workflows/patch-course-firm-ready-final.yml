name: Converge firm-ready courses

on:
  push:
    branches: [main]
    paths:
      - 'tools/course-continuity-v2.source.js'
      - 'tools/patch-course-continuity-v2.mjs'
      - 'tools/patch-account-isolation-course-continuity.mjs'
      - 'tests/course-pass-continuity-audit.mjs'
      - 'tests/account-isolation-course-continuity-audit.mjs'
      - 'tests/course-pass-continuity-browser-audit.cjs'
      - 'tests/legacy-simulation-refusal-browser-audit.cjs'
      - '.github/workflows/patch-course-firm-ready-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firm-ready-course-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply course continuity and professional workbench hardening
        run: |
          set -euo pipefail
          node tools/patch-course-continuity-v2.mjs
          node tools/patch-account-isolation-course-continuity.mjs
          node tools/patch-legacy-simulation-refusal.mjs
          node tools/patch-firm-ready-course-workbenches.mjs

      - name: Validate course source contracts and Worker package
        run: |
          set -euo pipefail
          node --check app.js
          node --check course-continuity.js
          node --check account-isolation-early.js
          node --check capital-mastery-live.js
          node --check v2/worker-v2-phase1-release.js
          node tests/course-pass-continuity-audit.mjs
          node tests/account-isolation-course-continuity-audit.mjs
          node tests/legacy-simulation-refusal-audit.mjs
          node tests/firm-ready-course-workbench-audit.mjs
          node tests/official-simulation-job-realism-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/applied-work-realism-audit.mjs
          node tests/all-career-v2-core-audit.mjs
          node tests/state-resilience-audit.mjs
          node tests/pages-production-bundle-audit.mjs
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Build exact Pages artifact and install Chromium
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist-pages >/tmp/cm-firm-ready-courses-http.log 2>&1 &
          echo $! > /tmp/cm-firm-ready-courses-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cm-firm-ready-courses-http.log
          exit 1

      - name: Prove passed-state continuity and no forced retakes
        env:
          CM_AUDIT_URL: http://127.0.0.1:4173
        run: node tests/course-pass-continuity-browser-audit.cjs

      - name: Prove stale MCQ simulations are refused
        env:
          CM_AUDIT_URL: http://127.0.0.1:4173
        run: node tests/legacy-simulation-refusal-browser-audit.cjs

      - name: Sweep all 16 career routes in Chromium
        env:
          CM_AUDIT_URL: http://127.0.0.1:4173
        run: node tests/all-career-browser-sweep.cjs

      - name: Commit firm-ready course product only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course-continuity.js account-isolation-early.js capital-mastery-live.js v2/worker-v2-phase1-release.js
          if git diff --cached --quiet; then
            echo 'No course product changes required.'
            exit 0
          fi
          git commit -m 'Finish firm-ready course continuity and workbenches'
          git push
