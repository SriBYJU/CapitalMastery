name: Admin credential onboarding boundary fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-admin-credential-onboarding-boundary.mjs'
      - 'tests/admin-credential-onboarding-boundary-audit.mjs'
      - '.github/workflows/admin-credential-onboarding-boundary-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-credential-onboarding-boundary-fix
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply admin onboarding boundary patch
        run: |
          set -euo pipefail
          node --check tools/patch-admin-credential-onboarding-boundary.mjs
          node tools/patch-admin-credential-onboarding-boundary.mjs
          node --check certificate-name.js
          node tests/admin-credential-onboarding-boundary-audit.mjs

      - name: Run complete static audit suite
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then continue; fi
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_STATIC_TEST_FILES=$count"

      - name: Build canonical GitHub Pages bundle
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Install Chromium and serve exact bundle
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist-pages >/tmp/cm-admin-boundary-http.log 2>&1 &
          echo $! >/tmp/cm-admin-boundary-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cm-admin-boundary-http.log
          exit 1

      - name: Prove admin and credential browser boundaries
        env:
          CM_AUDIT_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node tests/platform-admin-employer-usage-browser-audit.cjs
          node tests/admin-route-zero-exposure-browser-audit.cjs
          node tests/credentials-route-stability-browser-audit.cjs
          node tests/employer-role-matrix-browser-audit.cjs
          node tests/employer-invite-lifecycle-browser-audit.cjs
          node tests/accessibility-keyboard-browser-audit.cjs

      - name: Commit verified product fix only
        run: |
          set -euo pipefail
          git add certificate-name.js
          if git diff --cached --quiet; then
            echo 'Admin credential onboarding boundary already converged.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'capital-mastery-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep learner credential onboarding out of admin routes'
          git push origin HEAD:main
