name: Apply Career Skills integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-career-skills-track.mjs'
      - '.github/workflows/apply-career-skills-track.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: node tools/apply-career-skills-track.mjs

      - name: Syntax checks
        run: |
          node --check app.js
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
          node --check training-tracks.js

      - name: Career Skills focused audits
        run: |
          node tests/training-track-architecture-audit.mjs
          node tests/career-skills-track-audit.mjs

      - name: Full regression suite
        run: |
          set -e
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js enterprise-v2.js v2/worker-v2-phase1-release.js
          git commit -m 'Integrate Career Skills track into authoritative flows'
          git push origin HEAD:main
