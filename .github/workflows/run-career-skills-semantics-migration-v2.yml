name: Run Career Skills semantics migration v2
on:
  push:
    paths:
      - '.github/workflows/run-career-skills-semantics-migration-v2.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration and stale-test correction
        run: |
          python3 tools/fix-career-skills-credential-semantics.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/career-skills-track-audit.mjs')
          s=p.read_text()
          old="must(worker.includes('{ id: \"career\", title: \"Career Skills Certificate\", track: \"career_skills\"'), 'Enterprise catalog must expose Career Skills Certificate');"
          new="must(worker.includes('programCompletions:'), 'Enterprise catalog must separate program completion from the verified credential ladder');\nmust(worker.includes('{ id: \"career\", title: \"Career Skills Program Completion Certificate\", track: \"career_skills\"'), 'Enterprise catalog must expose Career Skills program completion separately');"
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Validate all static regressions and bundle
        run: |
          set -e
          node --check training-tracks.js
          node --check enterprise-v2.js
          node --check public-certificate-verify.js
          node --check v2/worker-v2-phase1-release.js
          for test in tests/*.mjs; do
            case "$test" in *browser*) continue ;; esac
            echo "=== $test ==="
            node "$test"
          done
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs
      - name: Commit corrected product and tests
        run: |
          set -e
          git config user.name 'Capital Mastery Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add training-tracks.js enterprise-v2.js public-certificate-verify.js v2/worker-v2-phase1-release.js tests/
          git diff --cached --quiet && { echo 'No product changes generated'; exit 1; }
          git commit -m 'Fix Career Skills credential boundary'
          git push origin HEAD:main
