name: Validate IB workbench syntax

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-ib-workbench-syntax.mjs'
      - '.github/workflows/patch-ib-workbench-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker packaging
        run: |
          set -euo pipefail
          node --check v2/worker-v2-phase1-release.js
          node tests/official-simulation-job-realism-audit.mjs
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
