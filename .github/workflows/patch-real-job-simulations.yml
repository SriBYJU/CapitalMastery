name: Patch real job simulations

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-real-job-simulations.mjs'
      - 'tests/official-simulation-job-realism-audit.mjs'
      - '.github/workflows/patch-real-job-simulations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded real-job simulation repair
        run: node tools/patch-real-job-simulations.mjs

      - name: Validate syntax and realism contract
        run: |
          set -euo pipefail
          node --check app.js
          node --check capital-mastery-live.js
          node --check v2/worker-v2-phase1-release.js
          node tests/official-simulation-job-realism-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/career-skills-assignment-scope-audit.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Commit product repair only
        run: |
          set -euo pipefail
          if git diff --quiet -- app.js capital-mastery-live.js v2/worker-v2-phase1-release.js; then
            echo 'No product changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js capital-mastery-live.js v2/worker-v2-phase1-release.js
          git commit -m 'Make official simulations real job workbenches'
          git push
