name: Apply course assessment state once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded course progression repairs
        run: |
          node tools/patch-course-assessment-state.mjs
          node tools/patch-course-continuity-v2.mjs
      - name: Validate patched runtimes
        run: |
          node --check app.js
          node --check course-continuity.js
          node --check capital-mastery-live.js
          node tests/course-assessment-state-audit.mjs
          node tests/course-pass-continuity-audit.mjs
      - name: Commit repair
        run: |
          if git diff --quiet -- app.js course-continuity.js capital-mastery-live.js; then
            echo 'No runtime changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js course-continuity.js capital-mastery-live.js
          git commit -m 'Centralize saved course progression and retakes'
          git push origin HEAD:main
