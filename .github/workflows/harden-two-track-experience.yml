name: Harden two-track experience

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden-two-track-experience.mjs'
      - '.github/workflows/harden-two-track-experience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply two-track hardening
        run: node tools/harden-two-track-experience.mjs
      - name: Syntax checks
        run: |
          node --check training-tracks.js
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
      - name: Two-track focused audits
        run: |
          node tests/training-track-architecture-audit.mjs
          node tests/career-skills-track-audit.mjs
          node tests/two-track-consistency-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit hardened sources
        run: |
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-tracks.js training-tracks.css enterprise-v2.js v2/worker-v2-phase1-release.js
          git commit -m 'Harden Career Skills and Professional Readiness consistency'
          git push origin HEAD:main
