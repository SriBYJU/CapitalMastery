name: Cleanup legacy credential stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-credential-stats.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Correct legacy credential statistics and audit language
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data_path = Path('data.js')
          data = data_path.read_text()
          old = '''  "stats": {\n    "credentials": "48",\n    "marketingCredentials": "45+",\n    "pathways": "16",'''
          new = '''  "stats": {\n    "credentials": "80",\n    "marketingCredentials": "80+",\n    "careerCredentialDefinitions": "80",\n    "academyAchievements": "8",\n    "pathways": "16",'''
          if old not in data:
              raise SystemExit('Expected legacy credential stats block not found; refusing partial migration')
          data = data.replace(old, new, 1)
          data_path.write_text(data)

          test_path = Path('tests/static-audit.mjs')
          test = test_path.read_text()
          old_test = '''ok(Number(d.stats.credentials)>=48,'Expected at least 48 credential slots');\nok(d.stats.marketingCredentials==='45+','Homepage marketing count should be 45+');'''
          new_test = '''ok(Number(d.stats.credentials)===80,'Legacy credential count alias should match 80 Standard 2.0 career definitions');\nok(d.stats.marketingCredentials==='80+','Marketing credential count should be 80+');\nok(Number(d.stats.careerCredentialDefinitions)===80,'Expected exactly 80 Standard 2.0 career credential definitions');\nok(Number(d.stats.academyAchievements)===8,'Expected 8 cross-career Academy achievements');'''
          if old_test not in test:
              raise SystemExit('Expected legacy static-audit assertions not found; refusing partial migration')
          test = test.replace(old_test, new_test, 1)
          old_log = "console.log(`STATIC AUDIT PASS: ${d.careers.length} careers, ${d.stats.credentials} credential slots, research/source mapping present.`);"
          new_log = "console.log(`STATIC AUDIT PASS: ${d.careers.length} careers, ${d.stats.careerCredentialDefinitions} Standard 2.0 career definitions + ${d.stats.academyAchievements} Academy achievements, research/source mapping present.`);"
          if old_log not in test:
              raise SystemExit('Expected legacy static-audit summary not found; refusing partial migration')
          test = test.replace(old_log, new_log, 1)
          test_path.write_text(test)
          PY

      - name: Verify corrected semantics
        run: |
          set -euo pipefail
          node tests/static-audit.mjs
          node tests/career-skills-five-level-boundary-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs

      - name: Run every static regression
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then
              continue
            fi
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_STATIC_TEST_FILES=$count"

      - name: Build and audit production Pages bundle
        run: |
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Commit corrected source
        run: |
          set -euo pipefail
          if git diff --quiet -- data.js tests/static-audit.mjs; then
            echo 'No changes produced; refusing empty migration commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js tests/static-audit.mjs
          git commit -m 'Align legacy credential stats with Standard 2.0'
          git push origin HEAD:main
