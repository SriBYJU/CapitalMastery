name: Harden public credential hierarchy

on:
  push:
    branches: [main]
    paths:
      - 'tools/harden-public-credential-hierarchy.mjs'
      - '.github/workflows/harden-public-credential-hierarchy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply public credential hierarchy hardening
        run: node tools/harden-public-credential-hierarchy.mjs
      - name: Syntax check
        run: node --check public-certificate-verify.js
      - name: Focused audit
        run: node tests/public-credential-hierarchy-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-certificate-verify.js
          git commit -m 'Make public certificate hierarchy credential-accurate'
          git push origin HEAD:main
