name: Bootstrap Capital Mastery release

on:
  push:
    branches: ["main"]
    paths:
      - "_bootstrap/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-capital-mastery
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore full project bundle
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/bundle-* > /tmp/cm-source.b64
          base64 --decode /tmp/cm-source.b64 > /tmp/cm-source.tar.gz
          tar -xzf /tmp/cm-source.tar.gz -C .
      - name: Install browser test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate organized product screenshots
        run: python docs/qa/generate_previews.py
      - name: Run full release audit
        shell: bash
        run: |
          node tests/static-audit.mjs
          node tests/logic-audit.mjs
          node tests/runtime-smoke.mjs
          python docs/qa/full_audit.py | tee docs/qa/latest-audit-output.txt
      - name: Remove bootstrap payload
        shell: bash
        run: |
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit complete release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build full Capital Mastery pre-Firebase release [skip bootstrap]"
            git push origin main
          fi
