name: Patch safe route decoding

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-safe-route-decoding.mjs'
      - '.github/workflows/patch-safe-route-decoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded route decoder patch
        run: |
          set -euo pipefail
          node tools/patch-safe-route-decoding.mjs
          node --check training-tracks.js
          git diff --check
      - name: Commit product fix
        run: |
          set -euo pipefail
          if git diff --quiet -- training-tracks.js; then
            echo 'Route decoder patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-tracks.js
          git commit -m 'Fail safely on malformed route encoding'
          git push origin HEAD:main
