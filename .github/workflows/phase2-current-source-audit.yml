name: Phase 2 current-source audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-current-source-audit.yml'
      - '.github/workflows/cloudflare-production-release.yml'
      - 'docs/operations/zero-cost-recovery-runbook.md'
      - 'index.html'
      - 'founder-admin-employer-usage.js'
      - 'founder-admin-employer-usage.css'
      - 'assets/sterling-point-logo.svg'
      - 'v2/platform-admin-overlay.js'
      - 'v2/worker-v2-phase1-release.js'
      - 'wrangler.jsonc'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax validation
        run: |
          node --check app.js
          node --check training-tracks.js
          node --check enterprise-v2.js
          node --check founder-admin-employer-usage.js
          node --check capital-mastery-live.js
          node --check public-certificate-verify.js
          node --check v2/worker-v2-phase1-release.js
          node --check v2/platform-admin-overlay.js
          node --check tests/platform-admin-employer-usage-browser-audit.cjs
          node --check tests/live-firestore-rules-probe.cjs
          node --check tests/live-admin-closure-probe.cjs
      - name: Platform admin and employer usage contract
        run: |
          node tests/platform-admin-employer-usage-logic-audit.mjs
          node tests/platform-admin-employer-usage-source-audit.mjs
      - name: D1 integrity route contract
        run: node tests/d1-integrity-endpoint-audit.mjs
      - name: Validate Cloudflare Worker package without deploying
        run: |
          set -euo pipefail
          rm -rf /tmp/capital-mastery-worker-dryrun
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir /tmp/capital-mastery-worker-dryrun
          test -d /tmp/capital-mastery-worker-dryrun
          echo 'WRANGLER_WORKER_DRY_RUN=PASS'
      - name: Build canonical GitHub Pages artifact
        run: node tools/build-pages.mjs
      - name: Run every static automated audit
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then
              continue
            fi
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_STATIC_TEST_FILES=$count"
      - name: Verify canonical production bundle after full static audit
        run: node tests/pages-production-bundle-audit.mjs
