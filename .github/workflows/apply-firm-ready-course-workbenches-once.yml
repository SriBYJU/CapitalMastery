name: Apply firm-ready course workbenches once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded workbench repair
        run: node tools/patch-firm-ready-course-workbenches.mjs
      - name: Validate firm-ready course layer
        run: |
          node --check v2/worker-v2-phase1-release.js
          node --check capital-mastery-live.js
          node tests/firm-ready-course-workbench-audit.mjs
          node tests/official-simulation-job-realism-audit.mjs
          node tests/deal-workbench-specialization-audit.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/worker-v2-phase1-release.js capital-mastery-live.js
          if git diff --cached --quiet; then
            echo 'No runtime changes were required.'
            exit 0
          fi
          git commit -m 'Upgrade career simulations with live workday updates'
          git push origin HEAD:main
