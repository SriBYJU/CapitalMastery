name: Live production read-only audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'tests/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/live-production-readonly-audit.yml'
  workflow_dispatch:

concurrency:
  group: live-production-readonly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: https://sribyju.github.io/CapitalMastery
      WORKER_URL: https://capital-mastery-api.avadhanula-shriyan.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Inspect GitHub Pages primary generation
        run: |
          set -u
          stale=1
          for attempt in {1..60}; do
            curl -fsSL --retry 2 --retry-all-errors "$LIVE_URL/?sha=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/live-index.html || true
            if grep -Fq 'capital-mastery-live.js?v=20260831-phase2rc7' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'firebase-sync.js?v=20260831-phase2rc7' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'ux-stability.js?v=20260831-phase2rc5' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'admin-route-guard.js?v=20260830-phase2rc1' /tmp/live-index.html 2>/dev/null \
              && grep -Fq '<link rel="canonical" href="https://sribyju.github.io/CapitalMastery/"' /tmp/live-index.html 2>/dev/null; then
              stale=0
              break
            fi
            sleep 5
          done
          if [ "$stale" -ne 0 ]; then
            echo 'LIVE_GENERATION_MISMATCH: GitHub Pages did not converge to the current primary generation'
          fi
          echo "LIVE_STALE=$stale" >> "$GITHUB_ENV"
          echo "LIVE_GENERATION_MATCH=$((1-stale))"

      - name: Inspect primary hosting invariants
        run: |
          set -u
          ok=1
          if ! curl -fsSI --retry 3 --retry-all-errors "$LIVE_URL/" -o /tmp/live-headers.txt; then
            echo 'LIVE_HEADERS_FETCH_FAILED'
            ok=0
          else
            tr -d '\r' < /tmp/live-headers.txt | tr '[:upper:]' '[:lower:]' > /tmp/live-headers-lower.txt
            echo '--- PRIMARY HOSTING HEADERS ---'
            grep -E '^(content-type|strict-transport-security|cache-control):' /tmp/live-headers-lower.txt || true
            if ! grep -Eq '^content-type:[[:space:]]*text/html' /tmp/live-headers-lower.txt; then echo 'MISSING_OR_WRONG: content-type'; ok=0; fi
            if ! grep -Eq '^strict-transport-security:' /tmp/live-headers-lower.txt; then echo 'MISSING: strict-transport-security'; ok=0; fi
          fi
          echo "LIVE_HEADERS_OK=$ok" >> "$GITHUB_ENV"
          echo "PRIMARY_HOSTING_INVARIANTS=$([ "$ok" -eq 1 ] && echo PASS || echo FAIL)"

      - name: Inspect Worker D1, CORS, origin and auth boundaries
        run: |
          set -u
          ok=1
          preflight_status=$(curl -sS --retry 3 --retry-all-errors -D /tmp/worker-preflight-headers.txt -o /tmp/worker-preflight-body.txt \
            -w '%{http_code}' -X OPTIONS "$WORKER_URL/auth-check" \
            -H 'Origin: https://sribyju.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' || echo 000)
          echo "WORKER_PREFLIGHT_STATUS=$preflight_status"
          case "$preflight_status" in 200|204) ;; *) echo 'WORKER_PREFLIGHT_BAD_STATUS'; ok=0;; esac
          if [ -f /tmp/worker-preflight-headers.txt ]; then
            tr -d '\r' < /tmp/worker-preflight-headers.txt | tr '[:upper:]' '[:lower:]' > /tmp/worker-preflight-lower.txt
            grep -E '^access-control-' /tmp/worker-preflight-lower.txt || true
            if ! grep -Eq '^access-control-allow-origin:[[:space:]]*\*$' /tmp/worker-preflight-lower.txt; then echo 'WORKER_CORS_RESPONSE_CONTRACT_MISMATCH'; ok=0; fi
            if ! grep -Eq '^access-control-allow-methods:.*post' /tmp/worker-preflight-lower.txt; then echo 'WORKER_POST_NOT_ALLOWED_BY_PREFLIGHT'; ok=0; fi
          else
            echo 'WORKER_PREFLIGHT_HEADERS_MISSING'
            ok=0
          fi

          health_status=$(curl -sS --retry 3 --retry-all-errors -o /tmp/worker-health-body.txt -w '%{http_code}' \
            "$WORKER_URL/health" -H 'Origin: https://sribyju.github.io' || echo 000)
          echo "WORKER_HEALTH_STATUS=$health_status"
          if [ "$health_status" != '200' ]; then echo 'WORKER_OR_D1_HEALTH_FAILED'; cat /tmp/worker-health-body.txt 2>/dev/null || true; ok=0; fi

          bad_origin_status=$(curl -sS --retry 3 --retry-all-errors -o /tmp/worker-bad-origin-body.txt -w '%{http_code}' \
            "$WORKER_URL/health" -H 'Origin: https://not-approved.example.invalid' || echo 000)
          echo "WORKER_BAD_ORIGIN_STATUS=$bad_origin_status"
          if [ "$bad_origin_status" != '403' ]; then echo 'WORKER_ORIGIN_ALLOWLIST_FAILED'; cat /tmp/worker-bad-origin-body.txt 2>/dev/null || true; ok=0; fi

          unauth_status=$(curl -sS --retry 3 --retry-all-errors -o /tmp/worker-unauth-body.txt -w '%{http_code}' \
            -X POST "$WORKER_URL/auth-check" \
            -H 'Origin: https://sribyju.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}' || echo 000)
          echo "WORKER_UNAUTH_POST_STATUS=$unauth_status"
          case "$unauth_status" in 401|403) ;; *) echo 'WORKER_AUTH_BOUNDARY_BAD_STATUS'; cat /tmp/worker-unauth-body.txt 2>/dev/null || true; ok=0;; esac

          integrity_status=$(curl -sS --retry 3 --retry-all-errors -o /tmp/worker-integrity-unauth-body.txt -w '%{http_code}' \
            "$WORKER_URL/admin/integrity" -H 'Origin: https://sribyju.github.io' || echo 000)
          echo "WORKER_INTEGRITY_UNAUTH_STATUS=$integrity_status"
          case "$integrity_status" in
            401|403) echo 'WORKER_D1_INTEGRITY_ROUTE_PRESENT_AND_PROTECTED' ;;
            404) echo 'WORKER_GENERATION_STALE: /admin/integrity not deployed'; ok=0 ;;
            *) echo 'WORKER_D1_INTEGRITY_ROUTE_BAD_STATUS'; cat /tmp/worker-integrity-unauth-body.txt 2>/dev/null || true; ok=0 ;;
          esac

          echo "WORKER_OK=$ok" >> "$GITHUB_ENV"
          echo "WORKER_PUBLIC_BOUNDARY=$([ "$ok" -eq 1 ] && echo PASS || echo FAIL)"

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect browser behavior against the GitHub Pages primary
        run: |
          set -u
          ok=1
          for test in \
            tests/state-resilience-browser-audit.cjs \
            tests/failure-seeking-browser-audit.mjs \
            tests/adversarial-chaos-browser-audit.cjs \
            tests/admin-route-zero-exposure-browser-audit.cjs \
            tests/learner-guide-mobile-browser-audit.cjs \
            tests/ib-workbench-navigation-guide-browser-audit.cjs \
            tests/all-career-browser-sweep.cjs \
            tests/employer-public-browser-audit.cjs \
            tests/employer-role-matrix-browser-audit.cjs \
            tests/employer-invite-lifecycle-browser-audit.cjs; do
            echo "=== LIVE $test ==="
            if ! CM_AUDIT_URL="$LIVE_URL" node "$test"; then
              echo "LIVE_BROWSER_TEST_FAILED: $test"
              ok=0
            fi
          done
          echo "LIVE_BROWSER_OK=$ok" >> "$GITHUB_ENV"
          echo "LIVE_BROWSER_AUDIT=$([ "$ok" -eq 1 ] && echo PASS || echo FAIL)"

      - name: Aggregate live release verdict
        if: always()
        run: |
          echo "LIVE_STALE=${LIVE_STALE:-1}"
          echo "LIVE_HEADERS_OK=${LIVE_HEADERS_OK:-0}"
          echo "WORKER_OK=${WORKER_OK:-0}"
          echo "LIVE_BROWSER_OK=${LIVE_BROWSER_OK:-0}"
          if [ "${LIVE_STALE:-1}" != "0" ] || [ "${LIVE_HEADERS_OK:-0}" != "1" ] || [ "${WORKER_OK:-0}" != "1" ] || [ "${LIVE_BROWSER_OK:-0}" != "1" ]; then
            echo 'LIVE_RELEASE_VERDICT=BLOCKED'
            exit 1
          fi
          echo 'LIVE_RELEASE_VERDICT=PASS'
