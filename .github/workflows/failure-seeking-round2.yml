name: Failure-seeking audit round 2

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - '_config.yml'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'v2/**'
      - 'tests/**'
      - 'docs/qa/**'
      - 'tools/build-pages.mjs'
      - 'tools/run-browser-audits-local.mjs'
      - 'tools/prepare-production-d1.mjs'
      - '.github/workflows/cloudflare-production-release.yml'
      - '.github/workflows/github-pages-live-readonly-audit.yml'
      - '.github/workflows/zero-cost-production-monitor.yml'
      - '.github/workflows/zero-cost-resilience-audit.yml'
      - '.github/workflows/failure-seeking-round2.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - '_config.yml'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - 'v2/**'
      - 'tests/**'
      - 'docs/qa/**'
      - 'tools/build-pages.mjs'
      - 'tools/run-browser-audits-local.mjs'
      - 'tools/prepare-production-d1.mjs'
      - '.github/workflows/cloudflare-production-release.yml'
      - '.github/workflows/github-pages-live-readonly-audit.yml'
      - '.github/workflows/zero-cost-production-monitor.yml'
      - '.github/workflows/zero-cost-resilience-audit.yml'
      - '.github/workflows/failure-seeking-round2.yml'
  workflow_dispatch:

concurrency:
  group: failure-seeking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Syntax validation
        run: |
          node --check brand-asset-resilience.js
          node --check state-resilience.js
          node --check certificate-name.js
          node --check firebase-sync.js
          node --check admin-route-guard.js
          node --check admin-qa-simulation-fix.js
          node --check capital-mastery-live.js
          node --check capital-mastery-live-ui.js
          node --check public-certificate-verify.js
          node --check firebase-auth.js
          node --check training-tracks.js
          node --check madeline.js
          node --check app.js
          node --check capital-mastery-e2e.js
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
          node --check tools/prepare-production-d1.mjs
          node --check tools/run-browser-audits-local.mjs
          node --check ux-stability.js
          node --check course-continuity.js
          node --check runtime-audit-fixes.js
          node --check tests/deployable-encoding-audit.mjs
          node --check tests/github-pages-publish-boundary-audit.mjs
          node --check tests/credential-name-root-persistence-audit.mjs
          node --check tests/failure-seeking-browser-audit.mjs
          node --check tests/adversarial-chaos-browser-audit.cjs
          node --check tests/admin-route-zero-exposure-browser-audit.cjs
          node --check tests/admin-simulation-route-stability-browser-audit.cjs
          node --check tests/program-completion-public-browser-audit.cjs
          node --check tests/learner-guide-mobile-browser-audit.cjs
          node --check tests/ib-workbench-navigation-guide-browser-audit.cjs
          node --check tests/all-career-browser-sweep.cjs
          node --check tests/employer-public-browser-audit.cjs
          node --check tests/employer-role-matrix-browser-audit.cjs
          node --check tests/employer-invite-lifecycle-browser-audit.cjs
          node --check tests/state-resilience-browser-audit.cjs
          node --check tests/course-assessment-state-browser-audit.cjs
          node --check tests/functional-persistence-reliability-browser-audit.cjs
          node --check tests/platform-admin-employer-usage-browser-audit.cjs
          node --check tests/course-pass-continuity-browser-audit.cjs
          node --check tests/course-no-skip-resume-browser-audit.cjs
          node --check tests/accessibility-keyboard-browser-audit.cjs
          node --check tests/production-health-monitor.cjs
          node --check tests/zero-cost-load-resilience-audit.cjs
          node --check tests/live-firestore-rules-probe.cjs
          node --check tests/live-admin-closure-probe.cjs
          node --check tests/firebase-direct-google-browser-audit.cjs

      - name: Failure-seeking static audits
        run: |
          node tests/failure-seeking-round2-audit.mjs
          node tests/admin-runtime-stability-audit.mjs
          node tests/admin-simulation-route-ownership-audit.mjs
          node tests/admin-route-boundary-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/career-skills-track-audit.mjs
          node tests/two-track-consistency-audit.mjs
          node tests/two-track-notification-reporting-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs
          node tests/program-completion-public-verification-audit.mjs
          node tests/credential-name-root-persistence-audit.mjs
          node tests/production-d1-release-order-audit.mjs
          node tests/deployable-encoding-audit.mjs
          node tests/github-pages-publish-boundary-audit.mjs
          node tests/phase2-security-a11y-audit.mjs
          node tests/state-resilience-audit.mjs
          node tests/employer-mobile-containment-audit.mjs
          node tests/csv-export-security-audit.mjs
          node tests/d1-integrity-endpoint-audit.mjs

      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then
              continue
            fi
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_STATIC_TEST_FILES=$count"

      - name: Build production Pages artifact
        run: |
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install "playwright==1.55.0"

      - name: Isolated full QA audit
        run: |
          python3 docs/qa/full_audit.py

      - name: Browser torture audits
        env:
          CM_AUDIT_URL: http://127.0.0.1:4173
        run: |
          node -e "const u=new URL(process.env.CM_AUDIT_URL); if(!['127.0.0.1','localhost','::1'].includes(u.hostname)) throw new Error('Browser QA must stay on loopback; refusing remote or production URL.');"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages > /tmp/capital-mastery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/course-pass-continuity-browser-audit.cjs
          node tests/course-no-skip-resume-browser-audit.cjs
          node tests/course-assessment-state-browser-audit.cjs
          node tests/state-resilience-browser-audit.cjs
          node tests/functional-persistence-reliability-browser-audit.cjs
          node tests/account-switch-app-state-browser-audit.cjs
          node tests/failure-seeking-browser-audit.mjs
          node tests/adversarial-chaos-browser-audit.cjs
          node tests/admin-route-zero-exposure-browser-audit.cjs
          node tests/admin-simulation-route-stability-browser-audit.cjs
          node tests/program-completion-public-browser-audit.cjs
          node tests/learner-guide-mobile-browser-audit.cjs
          node tests/ib-workbench-navigation-guide-browser-audit.cjs
          node tests/all-career-browser-sweep.cjs
          node tests/employer-public-browser-audit.cjs
          node tests/employer-role-matrix-browser-audit.cjs
          node tests/employer-invite-lifecycle-browser-audit.cjs
          node tests/platform-admin-employer-usage-browser-audit.cjs
          node tests/accessibility-keyboard-browser-audit.cjs
          node tests/firebase-direct-google-browser-audit.cjs
