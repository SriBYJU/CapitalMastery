name: Failure-seeking audit round 2

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'assets/**'
      - 'v2/**'
      - 'tests/**'
      - 'tools/build-pages.mjs'
      - '.github/workflows/failure-seeking-round2.yml'
  workflow_dispatch:

concurrency:
  group: failure-seeking-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Syntax validation
        run: |
          node --check state-resilience.js
          node --check certificate-name.js
          node --check admin-qa-simulation-fix.js
          node --check capital-mastery-live-ui.js
          node --check training-tracks.js
          node --check madeline.js
          node --check app.js
          node --check capital-mastery-e2e.js
          node --check ux-stability.js
          node --check course-continuity.js
          node --check runtime-audit-fixes.js
          node --check tests/failure-seeking-browser-audit.mjs
          node --check tests/learner-guide-mobile-browser-audit.cjs
          node --check tests/all-career-browser-sweep.cjs
          node --check tests/employer-public-browser-audit.cjs
          node --check tests/state-resilience-browser-audit.cjs

      - name: Failure-seeking static audits
        run: |
          node tests/failure-seeking-round2-audit.mjs
          node tests/admin-runtime-stability-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/career-skills-track-audit.mjs
          node tests/two-track-consistency-audit.mjs
          node tests/two-track-notification-reporting-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs
          node tests/phase2-security-a11y-audit.mjs
          node tests/state-resilience-audit.mjs
          node tests/employer-mobile-containment-audit.mjs

      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then
              continue
            fi
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_STATIC_TEST_FILES=$count"

      - name: Build production Pages artifact
        run: |
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser torture audits
        run: |
          python3 -m http.server 4173 > /tmp/capital-mastery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/state-resilience-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/failure-seeking-browser-audit.mjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/learner-guide-mobile-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/all-career-browser-sweep.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-public-browser-audit.cjs
