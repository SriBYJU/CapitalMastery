name: Correct Career Skills credential semantics v2

on:
  push:
    paths:
      - '.github/workflows/fix-career-skills-credential-semantics-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected credential semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n: p.write_text(s.replace(old,new))
              print(f'{path}: {n} replacement(s) for {old[:70]!r}')

          # Learner program model.
          r('training-tracks.js','verifiedCredentialCount: 4,','verifiedCredentialCount: 3,')
          r('training-tracks.js',"'Career Skills Certificate'","'Career Skills Program Completion Certificate'")
          r('training-tracks.js',"evidenceModel: '4 verified credentials · Career Skills ends at the practical capstone'","evidenceModel: '3 verified Standard 2.0 credentials + 1 program-completion certificate'")
          r('training-tracks.js','<span>${t.verifiedCredentialCount} credentials</span>',"<span>${professional?`${t.verifiedCredentialCount} verified credentials`:`${t.verifiedCredentialCount} verified credentials + completion certificate`}</span>")
          r('training-tracks.js','<span class="cm-track-badge">${t.verifiedCredentialCount} credentials</span>','<span class="cm-track-badge">${professional?`${t.verifiedCredentialCount} verified credentials`:`${t.verifiedCredentialCount} verified + completion certificate`}</span>')
          r('training-tracks.js','Complete the core pathway and practical capstone to earn the Career Skills Certificate. Switch to Professional Readiness later without repeating completed stages.','Complete the core pathway and practical capstone to earn the Career Skills Program Completion Certificate. Your three verified milestones carry into Professional Readiness, so upgrading does not repeat completed stages.')
          r('training-tracks.js',"['04','Career Skills Capstone','Complete the realistic server-graded job simulation and earn Career Skills'","['04','Career Skills Capstone','Complete the realistic server-graded job simulation and earn the program-completion certificate'")
          r('training-tracks.js',"'Four verified credentials. Shorter, still practical.'","'Three verified credentials + one completion certificate. Shorter, still practical.'")
          r('training-tracks.js',"const copy='Career Skills: 4 credentials · Professional Readiness: 5 credentials';","const copy='Career Skills: 3 verified + completion certificate · Professional Readiness: 5 verified credentials';")
          r('training-tracks.js','<article class="card"><div class="cm-track-public-top"><span>CAREER SKILLS</span><b>4 verified credentials</b></div>','<article class="card"><div class="cm-track-public-top"><span>CAREER SKILLS</span><b>3 verified + completion certificate</b></div>')
          r('training-tracks.js','The shorter credential never substitutes for the advanced Role Lab or Professional Readiness credential.','The Career Skills completion certificate is not a sixth Standard 2.0 credential and never substitutes for the advanced Role Lab or Professional Readiness credential.')
          r('training-tracks.js','<strong>4 credentials</strong>','<strong>3 verified + completion certificate</strong>')

          # Employer UI and exports.
          r('enterprise-v2.js',"return catalog?.credentialLadder?.find(c => c.id === id)?.title || String(id || '').replace(/-/g,' ').replace(/\\b\\w/g,m=>m.toUpperCase());","return catalog?.credentialLadder?.find(c => c.id === id)?.title || catalog?.programCompletions?.find(c => c.id === id)?.title || String(id || '').replace(/-/g,' ').replace(/\\b\\w/g,m=>m.toUpperCase());")
          r('enterprise-v2.js',"copy:'Complete the practical job simulation and earn the Career Certificate.'","copy:'Complete the practical job simulation and earn the Career Skills Program Completion Certificate.'")
          r('enterprise-v2.js','This shorter program is complete when the verified Career Skills Certificate is earned. Role Lab, Professional Final and Professional Readiness are intentionally not required.','This shorter program is complete when the Career Skills Program Completion Certificate is earned after the capstone. It sits outside the five-level Standard 2.0 credential ladder; Role Lab, Professional Final and Professional Readiness are intentionally not required.')
          r('enterprise-v2.js',"completionCredential:professional?'professional_readiness':'career'","completionRecord:professional?'professional_readiness':'career',\n        verifiedCredentialCount:professional?5:3,\n        careerSkillsCompletionCertificate:professional?false:true")

          # Worker catalog separates five verified levels from program completion.
          p=Path('v2/worker-v2-phase1-release.js'); s=p.read_text()
          old='''          credentialLadder: [\n            { id: "foundations", title: "Foundations Certificate", track: "foundations", level: "beginner" },\n            { id: "essentials", title: "Essentials Certificate", track: "foundations", level: "beginner" },\n            { id: "applied", title: "Applied Skills Certificate", track: "career_skills", level: "applied" },\n            { id: "career", title: "Career Skills Certificate", track: "career_skills", level: "applied" },\n            { id: "role_lab", title: "Role Lab Certificate", track: "professional", level: "advanced" },\n            { id: "professional_readiness", title: "Professional Readiness Certificate", track: "professional", level: "advanced" }\n          ],'''
          new='''          credentialLadder: [\n            { id: "foundations", title: "Foundations Credential", track: "career_skills", level: "foundational" },\n            { id: "essentials", title: "Essentials Credential", track: "career_skills", level: "foundational" },\n            { id: "applied", title: "Applied Skills Credential", track: "career_skills", level: "applied" },\n            { id: "role_lab", title: "Role Lab Credential", track: "professional", level: "advanced" },\n            { id: "professional_readiness", title: "Professional Readiness Credential", track: "professional", level: "advanced" }\n          ],\n          programCompletions: [\n            { id: "career", title: "Career Skills Program Completion Certificate", track: "career_skills", verifiedCredentialLevel: false, requires: "practical_capstone" }\n          ],'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          # Public verification remains compatible but semantically clear.
          r('public-certificate-verify.js',"label: 'Career Skills Certificate',","label: 'Career Skills Program Completion Certificate',")
          r('public-certificate-verify.js',"description: 'for completing the shorter practical Career Skills program, including Foundations, Essentials, Applied Skills and the required role-specific capstone simulation.'","description: 'for completing the shorter practical Career Skills program after the three verified Standard 2.0 milestones and the required role-specific capstone simulation. This completion certificate is not a sixth Standard 2.0 credential.'")
          r('public-certificate-verify.js',"const isCareer = levelKey === 'career';","const isProgramCompletion = levelKey === 'career';")
          r('public-certificate-verify.js',"const isFlagship = isCareer || isProfessional;","const isFlagship = isProfessional;")
          r('public-certificate-verify.js',"${isFlagship ? '<img class=\"cert-seal\" src=\"assets/seal.svg\" alt=\"Capital Mastery seal\">' : ''}","${(isFlagship || isProgramCompletion) ? '<img class=\"cert-seal\" src=\"assets/seal.svg\" alt=\"Capital Mastery seal\">' : ''}")
          r('public-certificate-verify.js',"This certificate is ${isFlagship ? 'proudly ' : ''}awarded to","This certificate is ${(isFlagship || isProgramCompletion) ? 'proudly ' : ''}awarded to")

          # Existing tests: change only assertions whose old meaning is now wrong.
          replacements={
            'tests/training-track-architecture-audit.mjs':[
              ("must(js.includes('verifiedCredentialCount: 4'), 'Career Skills must expose four verified credentials');","must(js.includes('verifiedCredentialCount: 3'), 'Career Skills must expose exactly three verified Standard 2.0 credentials');"),
              ("must(js.includes(\"'Career Skills Certificate'\"), 'Career Skills capstone credential missing');","must(js.includes(\"'Career Skills Program Completion Certificate'\"), 'Career Skills program-completion certificate missing');"),
              ("must(js.includes('4 verified credentials · Career Skills ends at the practical capstone'), 'Career Skills credential semantics missing');","must(js.includes('3 verified Standard 2.0 credentials + 1 program-completion certificate'), 'Career Skills credential/completion distinction missing');"),
              ("must(js.includes('Career Skills: 4 credentials · Professional Readiness: 5 credentials'), 'Career directory count correction missing');","must(js.includes('Career Skills: 3 verified + completion certificate · Professional Readiness: 5 verified credentials'), 'Career directory credential/completion distinction missing');")],
            'tests/public-two-track-positioning-audit.mjs':[
              ("must(js.includes('4 verified credentials'), 'Career Skills public credential count missing');","must(js.includes('3 verified + completion certificate'), 'Career Skills public credential/completion distinction missing');"),
              ("must(js.includes('shorter credential never substitutes for the advanced Role Lab'), 'Public comparison must preserve advanced credential boundary');","must(js.includes('completion certificate is not a sixth Standard 2.0 credential'), 'Public comparison must preserve the five-level Standard 2.0 boundary');")],
            'tests/public-credential-hierarchy-audit.mjs':[
              ("must(js.includes(\"label: 'Career Skills Certificate'\"), 'Career Skills certificate must be named explicitly');","must(js.includes(\"label: 'Career Skills Program Completion Certificate'\"), 'Career Skills program completion certificate must be named explicitly');"),
              ("must(js.includes('shorter practical Career Skills program'), 'Career Skills description must reflect the shorter practical program');","must(js.includes('not a sixth Standard 2.0 credential'), 'Career Skills completion certificate must be separated from the five-level Standard 2.0 ladder');"),
              ("must(js.includes('const isFlagship = isCareer || isProfessional'), 'Flagship visual treatment must cover both Career Skills and Professional Readiness');","must(js.includes(\"const isProgramCompletion = levelKey === 'career'\"), 'Career Skills completion records must be explicitly typed as program completion');\nmust(js.includes('const isFlagship = isProfessional'), 'Only Professional Readiness is the flagship verified credential');")],
            'tests/career-skills-report-export-audit.mjs':[
              ("must(enterprise.includes(\"completionCredential:professional?'professional_readiness':'career'\"), 'Evidence JSON must identify the correct completion credential');","must(enterprise.includes(\"completionRecord:professional?'professional_readiness':'career'\"), 'Evidence JSON must identify the authoritative completion record separately');\nmust(enterprise.includes('verifiedCredentialCount:professional?5:3'), 'Evidence JSON must state verified credential count by program');")],
            'tests/two-track-consistency-audit.mjs':[
              ("must(tracks.includes('Four verified credentials. Shorter, still practical.'), 'Career Skills self-directed sequence missing');","must(tracks.includes('Three verified credentials + one completion certificate. Shorter, still practical.'), 'Career Skills sequence must distinguish verified credentials from completion');"),
              ("must(worker.includes('Career Skills Certificate'), 'Worker credential title must identify Career Skills');","must(worker.includes('Career Skills Program Completion Certificate'), 'Worker must expose Career Skills program completion separately');\nmust(worker.includes('programCompletions:'), 'Worker catalog must separate program completion from credentialLadder');")]
          }
          for path,pairs in replacements.items():
              for old,new in pairs: r(path,old,new)

          Path('tests/career-skills-five-level-boundary-audit.mjs').write_text("""import fs from 'node:fs';
const worker=fs.readFileSync('v2/worker-v2-phase1-release.js','utf8');
const tracks=fs.readFileSync('training-tracks.js','utf8');
const verify=fs.readFileSync('public-certificate-verify.js','utf8');
const enterprise=fs.readFileSync('enterprise-v2.js','utf8');
const must=(c,m)=>{if(!c)throw new Error(m);};
const ladder=worker.match(/credentialLadder: \\[([\\s\\S]*?)\\],\\n          programCompletions:/)?.[1]||'';
const ids=[...ladder.matchAll(/id: \"([^\"]+)\"/g)].map(m=>m[1]);
must(JSON.stringify(ids)===JSON.stringify(['foundations','essentials','applied','role_lab','professional_readiness']),`Standard 2.0 ladder must have exactly five levels; got ${ids.join(', ')}`);
must(!/id: \"career\"/.test(ladder),'Career completion must not appear in Standard 2.0 credentialLadder');
must(worker.includes('programCompletions:'),'Worker catalog must expose program completion separately');
must(worker.includes('{ id: \"career\", title: \"Career Skills Program Completion Certificate\"'),'Career Skills completion descriptor missing');
must(tracks.includes('verifiedCredentialCount: 3'),'Career Skills must count three verified credentials');
must(tracks.includes('3 verified Standard 2.0 credentials + 1 program-completion certificate'),'Career Skills UI must distinguish credential and completion counts');
must(tracks.includes('5 Standard 2.0 career credentials'),'Professional Readiness must remain five verified credentials');
must(enterprise.includes('programCompletions?.find'),'Employer target labels must resolve program completion descriptors');
must(verify.includes('not a sixth Standard 2.0 credential'),'Public verification must disclose the five-level boundary');
must(worker.includes("credential_level='career'"),'Legacy/current career completion records must remain compatible and verifiable');
console.log('CAREER SKILLS FIVE-LEVEL BOUNDARY AUDIT PASS');
""")

          # Desired-state assertions after migration.
          checks={
            'training-tracks.js':['verifiedCredentialCount: 3','3 verified Standard 2.0 credentials + 1 program-completion certificate','5 Standard 2.0 career credentials'],
            'enterprise-v2.js':['programCompletions?.find','completionRecord:professional?', 'verifiedCredentialCount:professional?5:3'],
            'v2/worker-v2-phase1-release.js':['programCompletions:','Career Skills Program Completion Certificate'],
            'public-certificate-verify.js':['not a sixth Standard 2.0 credential','const isProgramCompletion']
          }
          for path,needles in checks.items():
              text=Path(path).read_text()
              for needle in needles:
                  if needle not in text: raise SystemExit(f'Desired state missing in {path}: {needle}')
          PY

      - name: Static + bundle regression gate
        shell: bash
        run: |
          set -e
          node --check training-tracks.js
          node --check enterprise-v2.js
          node --check public-certificate-verify.js
          node --check v2/worker-v2-phase1-release.js
          for test in tests/*.mjs; do
            case "$test" in *browser*) continue ;; esac
            echo "=== $test ==="
            node "$test"
          done
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Commit corrected product semantics
        shell: bash
        run: |
          set -e
          git config user.name 'Capital Mastery Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add training-tracks.js enterprise-v2.js public-certificate-verify.js v2/worker-v2-phase1-release.js tests/
          git diff --cached --quiet && { echo 'No product patch generated'; exit 1; }
          git commit -m 'Fix Career Skills credential boundary'
          git push origin HEAD:main
