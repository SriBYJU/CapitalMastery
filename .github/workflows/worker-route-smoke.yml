name: Worker route smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-route-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live protected employer usage route
        run: |
          set -euo pipefail
          url='https://capital-mastery-api.avadhanula-shriyan.workers.dev/enterprise/admin/organizations'
          status=$(curl -sS --retry 3 --retry-all-errors -o /tmp/body -w '%{http_code}' "$url" -H 'Origin: https://sribyju.github.io' || echo 000)
          echo "EMPLOYER_USAGE_STATUS=$status"
          case "$status" in
            401|403) echo 'WORKER_EMPLOYER_USAGE_ROUTE_PRESENT_AND_PROTECTED';;
            404) echo 'WORKER_EMPLOYER_USAGE_ROUTE_STALE_404'; cat /tmp/body || true; exit 2;;
            *) echo 'WORKER_EMPLOYER_USAGE_ROUTE_UNEXPECTED'; cat /tmp/body || true; exit 3;;
          esac
