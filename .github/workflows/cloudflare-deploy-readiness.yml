name: Cloudflare deploy readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build audited Pages artifact
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Upload exact audited Pages bundle
        uses: actions/upload-artifact@v4
        with:
          name: capitalmastery-pages-${{ github.sha }}
          path: dist-pages/
          if-no-files-found: error
          retention-days: 14

      - name: Check Cloudflare deploy secrets without revealing values
        run: |
          set -euo pipefail
          token_present=false
          account_present=false
          if [ -n "${CF_API_TOKEN:-}" ]; then token_present=true; fi
          if [ -n "${CF_ACCOUNT_ID:-}" ]; then account_present=true; fi
          echo "CLOUDFLARE_API_TOKEN_PRESENT=$token_present"
          echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=$account_present"
          if [ "$token_present" != true ] || [ "$account_present" != true ]; then
            echo 'CLOUDFLARE_DEPLOY_READY=false'
            exit 1
          fi
          echo 'CLOUDFLARE_DEPLOY_READY=true'
