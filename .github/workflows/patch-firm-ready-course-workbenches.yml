name: Patch firm-ready course workbenches

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-firm-ready-course-workbenches.mjs'
      - 'tests/firm-ready-course-workbench-audit.mjs'
      - '.github/workflows/patch-firm-ready-course-workbenches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply firm-ready workbench hardening
        run: node tools/patch-firm-ready-course-workbenches.mjs

      - name: Validate course and simulation contract
        run: |
          set -euo pipefail
          node --check capital-mastery-live.js
          node --check v2/worker-v2-phase1-release.js
          node tests/firm-ready-course-workbench-audit.mjs
          node tests/official-simulation-job-realism-audit.mjs
          node tests/training-track-architecture-audit.mjs
          node tests/pages-production-bundle-audit.mjs
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Commit product hardening only
        run: |
          set -euo pipefail
          if git diff --quiet -- capital-mastery-live.js v2/worker-v2-phase1-release.js; then
            echo 'No product changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capital-mastery-live.js v2/worker-v2-phase1-release.js
          git commit -m 'Harden career simulations into real workdays'
          git push
