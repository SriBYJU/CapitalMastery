name: One-time founder admin production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-founder-admin-release.yml'

permissions:
  contents: read

concurrency:
  group: capitalmastery-one-time-founder-admin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIMARY_URL: https://sribyju.github.io/CapitalMastery
      PRIMARY_ORIGIN: https://sribyju.github.io
      WORKER_URL: https://capital-mastery-api.avadhanula-shriyan.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Require existing production deployment credentials
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'PRODUCTION_CREDENTIAL_PRESENCE=PASS'

      - name: Re-run exact admin and release source gates
        run: |
          set -euo pipefail
          node --check founder-admin-employer-usage.js
          node --check v2/platform-admin-overlay.js
          node --check v2/worker-v2-phase1-release.js
          node tests/platform-admin-employer-usage-logic-audit.mjs
          node tests/platform-admin-employer-usage-source-audit.mjs
          node tests/admin-route-boundary-audit.mjs
          node tests/enterprise-least-privilege-audit.mjs
          node tests/d1-integrity-endpoint-audit.mjs
          node tests/recovery-readiness-audit.mjs
          node tests/production-d1-release-order-audit.mjs
          npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run

      - name: Build exact canonical frontend artifact
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Install Chromium test dependency
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E gate before production deployment
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist-pages > /tmp/cm-founder-release-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/platform-admin-employer-usage-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-invite-lifecycle-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/accessibility-keyboard-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/visual-contrast-browser-audit.cjs
          echo 'LOCAL_BROWSER_E2E_GATE=PASS'

      - name: Require live Firebase readiness before Worker deployment
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY_URL}/" node tests/live-firebase-auth-browser-audit.cjs

      - name: Read-only production D1 compatibility gate
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute capital-mastery-prod --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('organizations','organization_members','cohorts','cohort_members','program_assignments','enterprise_audit_events') ORDER BY name; PRAGMA quick_check; PRAGMA foreign_key_check;" > /tmp/cm-d1-readonly.txt
          for table in organizations organization_members cohorts cohort_members program_assignments enterprise_audit_events; do
            grep -q "$table" /tmp/cm-d1-readonly.txt || { echo "Missing required D1 table: $table"; exit 1; }
          done
          grep -q 'ok' /tmp/cm-d1-readonly.txt || { echo 'D1 quick_check did not report ok'; exit 1; }
          echo 'PRODUCTION_D1_READONLY_COMPATIBILITY=PASS'

      - name: Deploy audited Worker entrypoint
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify live Worker security boundaries
        run: |
          set -euo pipefail
          code=''
          for i in {1..24}; do
            code=$(curl -sS -o /tmp/cm-health -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/health" || true)
            [ "$code" = '200' ] && break
            sleep 5
          done
          [ "$code" = '200' ] || { echo "Worker health failed: HTTP $code"; exit 1; }
          bad_origin=$(curl -sS -o /tmp/cm-bad-origin -w '%{http_code}' -H 'Origin: https://not-capital-mastery.invalid' "${WORKER_URL}/health" || true)
          [ "$bad_origin" = '403' ] || { echo "Bad-origin boundary expected 403, got $bad_origin"; exit 1; }
          auth_check=$(curl -sS -o /tmp/cm-auth-check -w '%{http_code}' -X POST -H "Origin: ${PRIMARY_ORIGIN}" -H 'Content-Type: application/json' -d '{}' "${WORKER_URL}/auth-check" || true)
          [ "$auth_check" = '401' ] || { echo "Unauthenticated auth-check expected 401, got $auth_check"; exit 1; }
          employer_usage=$(curl -sS -o /tmp/cm-employer-usage -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/enterprise/admin/organizations" || true)
          case "$employer_usage" in 401|403) ;; *) echo "Employer Usage expected 401/403 without auth, got $employer_usage"; exit 1;; esac
          admin_integrity=$(curl -sS -o /tmp/cm-admin-integrity -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/admin/integrity" || true)
          case "$admin_integrity" in 401|403) ;; *) echo "Admin integrity expected 401/403 without auth, got $admin_integrity"; exit 1;; esac
          echo 'LIVE_WORKER_SECURITY_BOUNDARIES=PASS'

      - name: Require canonical GitHub Pages release markers
        run: |
          set -euo pipefail
          ready=false
          for i in {1..30}; do
            curl -fsS "${PRIMARY_URL}/" -o /tmp/cm-live-index || true
            if grep -q 'founder-admin-employer-usage.js?v=20260908-founderadmin1' /tmp/cm-live-index 2>/dev/null; then ready=true; break; fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'GitHub Pages has not published founder admin release markers'; exit 1; }
          curl -fsS "${PRIMARY_URL}/assets/sterling-point-logo.svg" -o /tmp/cm-live-sterling
          grep -q 'Sterling Point Advisors' /tmp/cm-live-sterling
          echo 'CANONICAL_GITHUB_PAGES_MARKERS=PASS'

      - name: Canonical frontend browser regression
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/platform-admin-employer-usage-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-invite-lifecycle-browser-audit.cjs
          echo 'CANONICAL_BROWSER_REGRESSION=PASS'

      - name: Release summary
        run: |
          cat <<'EOF'
          ONE_TIME_FOUNDER_ADMIN_RELEASE=PASS
          - exact-email platform admin gates passed
          - aggregate Employer Usage browser E2E passed
          - employer RBAC/invite regressions passed
          - production D1 compatibility was read-only and passed
          - Worker deployed through v2/platform-admin-overlay.js
          - live Worker unauthenticated/origin boundaries passed
          - canonical GitHub Pages markers and browser regressions passed
          EOF
