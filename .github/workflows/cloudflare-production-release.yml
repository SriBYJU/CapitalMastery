name: Capital Mastery production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE to promote the audited D1 schema and Cloudflare Worker; GitHub Pages is the canonical frontend'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capitalmastery-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIMARY_URL: https://sribyju.github.io/CapitalMastery
      PRIMARY_ORIGIN: https://sribyju.github.io
      WORKER_URL: https://capital-mastery-api.avadhanula-shriyan.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Require production deployment credentials
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'Cloudflare Worker credential presence check: PASS'

      - name: Re-run release source gate
        run: |
          set -euo pipefail
          node --check admin-route-guard.js
          node --check app.js
          node --check enterprise-v2.js
          node --check founder-admin-employer-usage.js
          node --check v2/worker-v2-phase1-release.js
          node --check v2/platform-admin-overlay.js
          node --check tools/prepare-production-d1.mjs
          node --check tests/platform-admin-employer-usage-browser-audit.cjs
          node --check tests/credentials-route-stability-browser-audit.cjs
          node tests/platform-admin-employer-usage-logic-audit.mjs
          node tests/platform-admin-employer-usage-source-audit.mjs
          node tests/admin-route-boundary-audit.mjs
          node tests/d1-integrity-endpoint-audit.mjs
          node tests/release-security-abuse-audit.mjs
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then continue; fi
            echo "=== $test_file ==="
            node "$test_file"
          done
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Build exact canonical static artifact
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs
          find dist-pages -type f -print0 | sort -z | xargs -0 sha256sum > dist-pages-sha256.txt
          sha256sum dist-pages-sha256.txt

      - name: Install Chromium release-test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Attack exact static artifact before production changes
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist-pages > /tmp/cm-release-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/platform-admin-employer-usage-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/credentials-route-stability-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-invite-lifecycle-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/accessibility-keyboard-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/visual-contrast-browser-audit.cjs

      - name: Require live Firebase readiness before any D1 mutation
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY_URL}/" node tests/live-firebase-auth-browser-audit.cjs

      - name: Prepare and verify production D1 schema before Worker
        run: |
          set -euo pipefail
          node tools/prepare-production-d1.mjs
          test -s d1-production-preflight.json
          cat d1-production-preflight.json

      - name: Deploy Worker only after D1 compatibility gate
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify Worker security boundaries
        run: |
          set -euo pipefail
          for i in {1..24}; do
            code=$(curl -sS -o /tmp/cm-health -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/health" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "Worker health failed: HTTP $code"; exit 1; }
          bad_origin=$(curl -sS -o /tmp/cm-bad-origin -w '%{http_code}' -H 'Origin: https://not-capital-mastery.invalid' "${WORKER_URL}/health" || true)
          [ "$bad_origin" = "403" ] || { echo "Bad-origin boundary expected 403, got $bad_origin"; exit 1; }
          auth_check=$(curl -sS -o /tmp/cm-auth-check -w '%{http_code}' -X POST -H "Origin: ${PRIMARY_ORIGIN}" -H 'Content-Type: application/json' -d '{}' "${WORKER_URL}/auth-check" || true)
          [ "$auth_check" = "401" ] || { echo "Unauthenticated auth-check expected 401, got $auth_check"; exit 1; }
          usage=$(curl -sS -o /tmp/cm-employer-usage -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/enterprise/admin/organizations" || true)
          case "$usage" in 401|403) echo "Protected employer-usage route present: HTTP $usage";; *) echo "Employer usage expected 401/403, got $usage"; exit 1;; esac
          integrity=$(curl -sS -o /tmp/cm-integrity -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/admin/integrity" || true)
          case "$integrity" in 401|403) echo "Protected D1 integrity route present: HTTP $integrity";; *) echo "D1 integrity expected 401/403, got $integrity"; exit 1;; esac

      - name: Verify canonical GitHub Pages generation
        run: |
          set -euo pipefail
          ready=false
          for i in {1..30}; do
            curl -fsS "${PRIMARY_URL}/" -o /tmp/cm-index || true
            if grep -q 'founder-admin-employer-usage.js?v=20260908-founderadmin2' /tmp/cm-index 2>/dev/null && grep -q 'ux-stability.js?v=20260908-credentials-stability1' /tmp/cm-index 2>/dev/null; then ready=true; break; fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'Canonical GitHub Pages has not published this release'; exit 1; }
          curl -fsS "${PRIMARY_URL}/assets/sterling-point-logo.svg" >/tmp/cm-sterling-logo
          grep -q 'Sterling Point Advisors' /tmp/cm-sterling-logo
          echo 'Canonical GitHub Pages release markers: PASS'

      - name: Canonical frontend Chromium verification
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/platform-admin-employer-usage-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/credentials-route-stability-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL="${PRIMARY_URL}" node tests/employer-invite-lifecycle-browser-audit.cjs

      - name: Release boundary summary
        run: |
          cat <<'EOF'
          CAPITAL MASTERY PRODUCTION RELEASE GATE: PASS
          - GitHub Pages is the only canonical frontend deployment target.
          - No Cloudflare Pages deployment or mirror verification occurs in this workflow.
          - Exact-email platform-admin source/logic/browser tests passed.
          - Credentials route stability passed at mobile, tablet, and desktop widths.
          - Employer role and invitation regressions passed.
          - Production D1 compatibility gate passed before Worker deployment.
          - Worker auth/origin/admin boundaries passed after deployment.
          - Canonical GitHub Pages release markers and Chromium tests passed.
          EOF
