name: Cloudflare production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RELEASE to promote the audited D1 schema, Worker and secondary Cloudflare Pages mirror'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capitalmastery-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirmation == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIMARY_URL: https://sribyju.github.io/CapitalMastery
      PRIMARY_ORIGIN: https://sribyju.github.io
      CLOUDFLARE_MIRROR_URL: https://capitalmastery.pages.dev
      WORKER_URL: https://capital-mastery-api.avadhanula-shriyan.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Require production deployment credentials
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'Cloudflare credential presence check: PASS'

      - name: Re-run release source gate
        run: |
          set -euo pipefail
          node --check admin-route-guard.js
          node --check app.js
          node --check course-state.js
          node --check course-continuity.js
          node --check course-release-fix.js
          node --check training-tracks.js
          node --check capital-mastery-live.js
          node --check capital-mastery-live-ui.js
          node --check public-certificate-verify.js
          node --check certificate-name.js
          node --check firebase-sync.js
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
          node --check tools/prepare-production-d1.mjs
          node --check tests/firebase-authorized-domain-browser-audit.cjs
          node --check tests/live-firebase-auth-browser-audit.cjs
          node --check tests/adversarial-chaos-browser-audit.cjs
          node --check tests/course-assessment-state-browser-audit.cjs
          node --check tests/course-pass-continuity-browser-audit.cjs
          node --check tests/legacy-simulation-refusal-browser-audit.cjs
          node --check tests/ib-workbench-navigation-guide-browser-audit.cjs
          node --check tests/employer-invite-lifecycle-browser-audit.cjs
          node --check tests/v2-assessment-review-browser-audit.cjs
          node --check tests/visual-contrast-browser-audit.cjs
          node --check tests/admin-route-zero-exposure-browser-audit.cjs
          node --check tests/admin-simulation-route-stability-browser-audit.cjs
          node --check tests/program-completion-public-browser-audit.cjs
          node tests/admin-route-boundary-audit.mjs
          node tests/d1-integrity-endpoint-audit.mjs
          node tests/release-security-abuse-audit.mjs
          node tests/career-skills-five-level-boundary-audit.mjs
          node tests/program-completion-public-verification-audit.mjs
          node tests/credential-name-root-persistence-audit.mjs
          for test_file in tests/*.mjs; do
            if [ "$test_file" = "tests/failure-seeking-browser-audit.mjs" ]; then
              continue
            fi
            echo "=== $test_file ==="
            node "$test_file"
          done
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

      - name: Build exact production Pages bundle
        run: |
          set -euo pipefail
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs
          find dist-pages -type f -print0 | sort -z | xargs -0 sha256sum > dist-pages-sha256.txt
          echo "DEPLOYABLE_FILE_COUNT=$(find dist-pages -type f | wc -l | tr -d ' ')"
          sha256sum dist-pages-sha256.txt

      - name: Install Chromium release-test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Attack exact Pages artifact before deployment
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist-pages > /tmp/capital-mastery-release-preflight-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/state-resilience-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/course-assessment-state-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/course-pass-continuity-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/legacy-simulation-refusal-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/ib-workbench-navigation-guide-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/v2-assessment-review-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/failure-seeking-browser-audit.mjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/adversarial-chaos-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/admin-simulation-route-stability-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/program-completion-public-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/learner-guide-mobile-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/all-career-browser-sweep.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/employer-invite-lifecycle-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/visual-contrast-browser-audit.cjs
          CM_CANONICAL_URL=http://127.0.0.1:4173/ node tests/firebase-authorized-domain-browser-audit.cjs

      - name: Require live Firebase readiness before any D1 mutation
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${PRIMARY_URL}/" node tests/live-firebase-auth-browser-audit.cjs
          echo 'Firebase email/password persistence + exact-artifact provider-safety gate: PASS'

      - name: Prepare and verify production D1 schema before Worker
        run: |
          set -euo pipefail
          node tools/prepare-production-d1.mjs
          test -s d1-production-preflight.json
          cat d1-production-preflight.json

      - name: Deploy Worker only after D1 compatibility gate
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify Worker public and security boundaries
        run: |
          set -euo pipefail
          for i in {1..24}; do
            code=$(curl -sS -o /tmp/cm-health -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          [ "$code" = "200" ] || { echo "Worker health failed: HTTP $code"; cat /tmp/cm-health || true; exit 1; }

          bad_origin=$(curl -sS -o /tmp/cm-bad-origin -w '%{http_code}' -H 'Origin: https://not-capital-mastery.invalid' "${WORKER_URL}/health" || true)
          [ "$bad_origin" = "403" ] || { echo "Bad-origin boundary expected 403, got $bad_origin"; exit 1; }

          auth_check=$(curl -sS -o /tmp/cm-auth-check -w '%{http_code}' -X POST -H "Origin: ${PRIMARY_ORIGIN}" -H 'Content-Type: application/json' -d '{}' "${WORKER_URL}/auth-check" || true)
          [ "$auth_check" = "401" ] || { echo "Unauthenticated auth-check expected 401, got $auth_check"; exit 1; }

          integrity=$(curl -sS -o /tmp/cm-integrity -w '%{http_code}' -H "Origin: ${PRIMARY_ORIGIN}" "${WORKER_URL}/admin/integrity" || true)
          if [ "$integrity" = "404" ]; then
            echo 'D1 integrity route is still absent after Worker deploy'
            exit 1
          fi
          case "$integrity" in
            401|403) echo "Protected D1 integrity route present: HTTP $integrity" ;;
            *) echo "Unauthenticated D1 integrity route expected 401/403, got $integrity"; exit 1 ;;
          esac

      - name: Deploy exact Pages bundle
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist-pages --project-name=capitalmastery --branch=main

      - name: Verify Cloudflare mirror generation and security headers
        run: |
          set -euo pipefail
          ready=false
          for i in {1..30}; do
            curl -fsS -D /tmp/cm-headers "${CLOUDFLARE_MIRROR_URL}/" -o /tmp/cm-index || true
            if grep -q 'accessibility-fixes.css' /tmp/cm-index 2>/dev/null && grep -qi '^x-frame-options: *DENY' /tmp/cm-headers 2>/dev/null && grep -qi '^permissions-policy:' /tmp/cm-headers 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          [ "$ready" = true ] || {
            echo 'Cloudflare mirror generation/header verification failed'
            echo '--- headers ---'
            cat /tmp/cm-headers || true
            echo '--- index markers ---'
            grep -E 'training-tracks|learner-guide|runtime-audit|admin-route-guard' /tmp/cm-index || true
            exit 1
          }
          grep -q 'training-tracks.js' /tmp/cm-index
          grep -q 'course-state.js' /tmp/cm-index
          grep -q 'course-release-fix.js' /tmp/cm-index
          grep -q 'learner-guide.js' /tmp/cm-index
          grep -q 'enterprise-v2.js' /tmp/cm-index
          grep -q 'admin-route-guard.js' /tmp/cm-index
          echo 'Cloudflare mirror generation and production headers: PASS'

      - name: Run Cloudflare mirror Chromium release matrix
        run: |
          set -euo pipefail
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/state-resilience-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/course-assessment-state-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/course-pass-continuity-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/legacy-simulation-refusal-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/ib-workbench-navigation-guide-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/v2-assessment-review-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/failure-seeking-browser-audit.mjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/adversarial-chaos-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/admin-route-zero-exposure-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/admin-simulation-route-stability-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/program-completion-public-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/learner-guide-mobile-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/all-career-browser-sweep.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/employer-public-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/employer-role-matrix-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/employer-invite-lifecycle-browser-audit.cjs
          CM_AUDIT_URL="${CLOUDFLARE_MIRROR_URL}" node tests/visual-contrast-browser-audit.cjs
          CM_CANONICAL_URL="${CLOUDFLARE_MIRROR_URL}/" node tests/firebase-authorized-domain-browser-audit.cjs

      - name: Release boundary summary
        run: |
          cat <<'EOF'
          CLOUDFLARE MIRROR PROMOTION GATE: PASS

          This proves:
          - current source/static regression gate passed
          - Worker dry-run packaging passed before deployment
          - exact dist-pages artifact survived seventeen hostile Chromium suites before any production mutation
          - live Firebase email/password credential-name persistence passed before any D1 mutation
          - exact-artifact Firebase provider-safety probe passed before any D1 mutation
          - production D1 schema was inspected and only missing migrations 016/017/018 were conditionally applied
          - D1 row-count preservation, quick_check and foreign_key_check passed before Worker deployment
          - Worker deployed only after D1 compatibility was proven
          - Worker public/auth/origin boundaries passed
          - protected /admin/integrity route exists
          - exact production Pages allowlist deployed
          - Cloudflare-mirror Firebase provider-safety probe passed after Pages deployment
          - Cloudflare mirror generation/security headers passed
          - seventeen Cloudflare-mirror Chromium suites passed again after deployment, including course continuity, review/retake separation, non-MCQ simulation refusal, employer invitation lifecycle, visual contrast, the Admin auth-timing race, and Program Completion verification

          This does NOT close Phase 2 by itself. Still required:
          - authenticated administrator /admin/integrity execution and D1 counts
          - authenticated learner/employer/admin/second-tenant production smokes
          - disposable QA cleanup and post-cleanup integrity verification
          EOF
