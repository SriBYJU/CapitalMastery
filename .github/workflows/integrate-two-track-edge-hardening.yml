name: Integrate two-track edge hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-two-track-edge-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply all pending two-track edge hardening
        run: |
          node tools/harden-track-notifications-reporting.mjs
          node tools/fix-track-attention-regression.mjs
          node tools/harden-public-credential-hierarchy.mjs
      - name: Syntax checks
        run: |
          node --check enterprise-v2.js
          node --check v2/worker-v2-phase1-release.js
          node --check public-certificate-verify.js
      - name: Focused edge audits
        run: |
          node tests/two-track-notification-reporting-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs
          node tests/two-track-consistency-audit.mjs
          node tests/employer-firm-ready-audit.mjs
          node tests/employer-operations-audit.mjs
          node tests/notification-discovery-audit.mjs
          node tests/phase2-security-a11y-audit.mjs
      - name: Full regression suite
        run: |
          set -e
          count=0
          for test_file in tests/*.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count+1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit coherent hardened sources
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enterprise-v2.js v2/worker-v2-phase1-release.js public-certificate-verify.js
          git commit -m 'Harden two-track notifications reporting and verification'
          git push origin HEAD:main
