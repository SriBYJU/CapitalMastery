name: Patch program completion public verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-program-completion-public-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          node tools/patch-program-completion-public-verification.mjs
          node --check v2/worker-v2-phase1-release.js
          node --check capital-mastery-live.js
          node --check public-certificate-verify.js

      - name: Install permanent static regression
        run: |
          cat > tests/program-completion-public-verification-audit.mjs <<'EOF'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const worker=fs.readFileSync('v2/worker-v2-phase1-release.js','utf8');
          const live=fs.readFileSync('capital-mastery-live.js','utf8');
          const cert=fs.readFileSync('public-certificate-verify.js','utf8');
          const migration=fs.readFileSync('migrations/017_phase2_program_completion_records.sql','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);};

          ok(worker.includes('programCompletions: completionResult.results || []'),'My Credentials API must return program completions separately');
          ok(worker.includes('FROM program_completion_records')&&worker.includes('WHERE public_token = ?'),'Public verifier must resolve program-completion tokens');
          ok(worker.includes('recordType: "program_completion"'),'Public verifier must explicitly classify program-completion records');
          ok(worker.includes('not a sixth Standard 2.0 credential'),'Public verifier must preserve five-level Standard semantics');
          ok(worker.includes('POST /admin/program-completions/:id/revoke'),'Program completions need an audited revocation path');
          ok(worker.includes("'program_completion.revoked'"),'Program-completion revocation must create enterprise audit evidence');
          const publicStart=worker.indexOf('// PUBLIC CREDENTIAL / PROGRAM COMPLETION VERIFICATION');
          const publicEnd=worker.indexOf('// ADMIN REVOKE',publicStart);
          const publicSlice=worker.slice(publicStart,publicEnd);
          ok(publicStart>=0&&publicEnd>publicStart,'Could not isolate public verification handler');
          ok(!publicSlice.includes('orgId:'),'Public program verification must not return organization IDs');
          ok(!publicSlice.includes('assignmentId:'),'Public program verification must not return assignment IDs');
          ok(!publicSlice.includes('cohortId:'),'Public program verification must not return cohort IDs');
          ok(!publicSlice.includes('uid:'),'Public program verification must not return internal user IDs');

          ok(live.includes('PROGRAM COMPLETIONS')&&live.includes('Verify Program Completion'),'Learner records page must render program completions separately');
          ok(live.includes("data-record-type=\"${isProgramCompletion?'program_completion':'credential'}\""),'Public verification DOM must expose record classification');
          ok(live.includes('VERIFIED PROGRAM COMPLETION ✓'),'Active program completion needs distinct verification badge');
          ok(live.includes('Completion ID'),'Program completion verifier must label its identifier correctly');
          ok(live.includes('Public verification excludes private account, organization, cohort and assignment identifiers.'),'Public verifier must state its privacy boundary');
          ok(cert.includes("isProgramCompletion ? 'COMPLETION ID' : 'CREDENTIAL ID'"),'Printable certificate must use Completion ID for program completions');
          ok(cert.includes('✓ Verified program completion'),'Printable proof must distinguish program completion from credential verification');
          ok(migration.includes("status IN ('active','revoked')")&&migration.includes('public_token TEXT NOT NULL UNIQUE'),'D1 schema must support unique public tokens and revocation');

          const py=String.raw`
          import sqlite3,json
          con=sqlite3.connect(':memory:')
          con.execute('''CREATE TABLE program_completion_records(completion_id TEXT PRIMARY KEY,public_token TEXT UNIQUE,uid TEXT,holder_name TEXT,pathway_id TEXT,program_code TEXT,completion_title TEXT,status TEXT,org_id TEXT,cohort_id TEXT,assignment_id TEXT,capstone_score INTEGER,evidence_summary_json TEXT,issued_at TEXT,revoked_at TEXT,revocation_reason TEXT)''')
          con.execute("INSERT INTO program_completion_records VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",('CM-CS-IB-2026-TEST','public-safe-token','uid_secret','Audit Learner','investment-banking','career_skills','Investment Banking Career Skills Program Completion Certificate','active','org_secret','cohort_secret','assignment_secret',88,json.dumps({'standardVersion':'2.0','verifiedCredentials':[{'level':'foundations','title':'Foundations','standardVersion':'2.0','issuedAt':'2026-08-01'}],'assignmentId':'assignment_secret','orgId':'org_secret'}),'2026-08-30',None,None))
          row=con.execute('''SELECT completion_id,holder_name,pathway_id,program_code,completion_title,status,capstone_score,evidence_summary_json,issued_at,revoked_at FROM program_completion_records WHERE public_token=?''',('public-safe-token',)).fetchone()
          summary=json.loads(row[7]); safe={'completionId':row[0],'holderName':row[1],'pathwayId':row[2],'programCode':row[3],'title':row[4],'status':row[5],'capstoneScore':row[6],'standardVersion':summary.get('standardVersion'),'verifiedCredentials':[{k:x.get(k) for k in ('level','title','standardVersion','issuedAt')} for x in summary.get('verifiedCredentials',[])], 'issuedAt':row[8],'revokedAt':row[9]}
          payload=json.dumps(safe)
          assert 'org_secret' not in payload and 'cohort_secret' not in payload and 'assignment_secret' not in payload and 'uid_secret' not in payload
          con.execute("UPDATE program_completion_records SET status='revoked',revoked_at='2026-08-31',revocation_reason='audit' WHERE completion_id='CM-CS-IB-2026-TEST'")
          assert con.execute("SELECT status FROM program_completion_records").fetchone()[0]=='revoked'
          print('SQLITE PROGRAM COMPLETION PUBLIC PRIVACY FIXTURE PASS')
          `;
          const run=spawnSync('python3',['-c',py],{encoding:'utf8'});
          if(run.status!==0) throw new Error(run.stderr||run.stdout||'SQLite fixture failed');
          process.stdout.write(run.stdout);
          console.log('PROGRAM COMPLETION PUBLIC VERIFICATION AUDIT PASS');
          EOF
          node --check tests/program-completion-public-verification-audit.mjs

      - name: Install permanent Chromium regression
        run: |
          cat > tests/program-completion-public-browser-audit.cjs <<'EOF'
          const { chromium } = require('playwright');
          const BASE=process.env.CM_AUDIT_URL||'http://127.0.0.1:4173';
          const WORKER='https://capital-mastery-api.avadhanula-shriyan.workers.dev';
          const UID='program-completion-browser-audit';
          const assert=(v,m)=>{if(!v)throw new Error(m);};
          const activeRecord={ok:true,valid:true,recordType:'program_completion',credential:{recordType:'program_completion',credentialId:'CM-CS-IB-2026-AUDIT',completionId:'CM-CS-IB-2026-AUDIT',holderName:'Audit Learner',pathwayId:'investment-banking',level:'career',programCode:'career_skills',title:'Investment Banking Career Skills Program Completion Certificate',status:'active',standardVersion:'2.0',issuedAt:'2026-08-30T18:00:00Z',revokedAt:null,description:'Completed the Career Skills program after earning three verified Standard 2.0 credentials and passing the practical capstone. This is a program-completion certificate, not a sixth Standard 2.0 credential.'},evidence:[{type:'program_completion',title:'Career Skills practical capstone',score:88,minimumScore:80,requiredVerifiedCredentials:3,verifiedCredentials:[{level:'foundations',title:'Investment Banking Foundations Credential',standardVersion:'2.0',issuedAt:'2026-08-01'}]}]};
          const revokedRecord={...activeRecord,valid:false,credential:{...activeRecord.credential,credentialId:'CM-CS-IB-2026-REVOKED',completionId:'CM-CS-IB-2026-REVOKED',status:'revoked',revokedAt:'2026-08-31T00:00:00Z'}};
          function authStub(){return `(()=>{const user={uid:'${UID}',email:'audit@example.invalid',displayName:'Audit Learner'};window.CM_AUTH={ready:true,user,isAdmin:false,backendVerified:true,getIdToken:async()=> 'program-completion-audit-token',googleSignIn:async()=>user,emailSignIn:async()=>user,emailCreate:async()=>user,signOut:async()=>{},resetPassword:async()=>{},deleteAccount:async()=>{}};setTimeout(()=>document.dispatchEvent(new CustomEvent('cm-auth-changed',{detail:{user,isAdmin:false,backendVerified:true}})),0);})();`;}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            try{
              await context.addInitScript(({uid})=>localStorage.setItem('cmCredentialNameOnboardedV3:'+uid,'true'),{uid:UID});
              await context.route(/\/firebase-auth\.js(?:\?.*)?$/,r=>r.fulfill({status:200,contentType:'application/javascript',body:authStub()}));
              await context.route(/\/firebase-sync\.js(?:\?.*)?$/,r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.CM_SYNC={ready:true,flush:async()=>true};'}));
              await context.route(`${WORKER}/**`,async r=>{
                const u=new URL(r.request().url());
                if(u.pathname==='/credentials/me') return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,credentials:[{credential_id:'CM-IB-F-2026-AUDIT',public_token:'cred-token',pathway_id:'investment-banking',credential_level:'foundations',credential_title:'Investment Banking Foundations Credential',holder_name:'Audit Learner',status:'active',issued_at:'2026-08-01T00:00:00Z'}],programCompletions:[{completion_id:'CM-CS-IB-2026-AUDIT',public_token:'pc-active',pathway_id:'investment-banking',program_code:'career_skills',completion_title:'Investment Banking Career Skills Program Completion Certificate',status:'active',capstone_score:88,issued_at:'2026-08-30T18:00:00Z'}]})});
                if(u.pathname.startsWith('/enterprise/verify/')) return r.fulfill({status:404,contentType:'application/json',body:JSON.stringify({ok:false,error:'not found'})});
                if(u.pathname==='/verify/pc-active') return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(activeRecord)});
                if(u.pathname==='/verify/pc-revoked') return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(revokedRecord)});
                if(u.pathname.startsWith('/progress/')) return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,progress:[]})});
                return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true})});
              });
              const page=await context.newPage();
              await page.goto(BASE+'/#/credentials',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('.cm-program-completion-card',{timeout:10000});
              const recordsText=await page.locator('#app').innerText();
              assert(/STANDARD 2\.0 CREDENTIALS/.test(recordsText),'Verified credential section missing');
              assert(/PROGRAM COMPLETIONS/.test(recordsText),'Program Completions section missing');
              assert(/Completion ID/.test(recordsText),'Program completion card must use Completion ID');
              assert(/Verify Program Completion/.test(recordsText),'Program completion verification action missing');
              assert(!/org_secret|assignment_secret|cohort_secret|uid_secret/.test(recordsText),'Private scope identifiers leaked on learner records page');
              await page.getByRole('link',{name:/Verify Program Completion/}).click();
              await page.waitForSelector('.cm-verification[data-record-type="program_completion"]',{timeout:10000});
              await page.waitForSelector('.cm-public-certificate-section',{timeout:10000});
              let text=await page.locator('#app').innerText();
              assert(/VERIFIED PROGRAM COMPLETION/.test(text),'Active public program-completion badge missing');
              assert(/not a sixth Standard 2\.0 credential/i.test(text),'Five-level boundary explanation missing on public verifier');
              assert(/Completion ID/.test(text),'Public verifier must use Completion ID');
              const certText=await page.locator('.cm-public-certificate-section').innerText();
              assert(/program-completion certificate/i.test(certText),'Printable program-completion certificate wording missing');
              assert(/COMPLETION ID/.test(certText),'Printable certificate must use Completion ID');
              assert(!/CREDENTIAL ID/.test(certText),'Printable program completion must not label its identifier Credential ID');
              assert(!/org_secret|assignment_secret|cohort_secret|uid_secret/.test(text),'Public verifier leaked private scope identifiers');

              await page.evaluate(()=>location.hash='#/verify/pc-revoked');
              await page.waitForFunction(()=>document.querySelector('.cm-verification[data-record-type="program_completion"]')?.textContent?.includes('REVOKED'),null,{timeout:10000});
              text=await page.locator('#app').innerText();
              assert(/PROGRAM COMPLETION REVOKED/.test(text),'Revoked program completion must render as revoked, not valid');
              await page.waitForSelector('.cm-public-certificate-section',{timeout:10000});
              const revokedCert=await page.locator('.cm-public-certificate-section').innerText();
              assert(/Program completion is not currently active/.test(revokedCert),'Revoked printable certificate proof must be inactive');
              console.log('PROGRAM COMPLETION PUBLIC BROWSER AUDIT PASS: separate listing, active verification, privacy boundary, certificate semantics and revocation');
            }finally{await context.close().catch(()=>{});await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF
          node --check tests/program-completion-public-browser-audit.cjs

      - name: Focused source and SQLite regressions
        run: |
          set -euo pipefail
          node tests/program-completion-public-verification-audit.mjs
          node tests/career-skills-assignment-scope-audit.mjs
          node tests/career-skills-five-level-boundary-audit.mjs
          node tests/career-skills-report-export-audit.mjs
          node tests/public-credential-hierarchy-audit.mjs
          node tests/account-deletion-audit.mjs
          node tools/build-pages.mjs
          node tests/pages-production-bundle-audit.mjs

      - name: Focused Chromium proof
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory dist-pages >/tmp/cm-program-completion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/program-completion-public-browser-audit.cjs

      - name: Commit only after all focused gates pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/worker-v2-phase1-release.js capital-mastery-live.js public-certificate-verify.js tests/program-completion-public-verification-audit.mjs tests/program-completion-public-browser-audit.cjs
          git diff --cached --check
          git commit -m 'Add public Career Skills completion verification'
          git push
