name: Firebase live authentication audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-live-auth-audit.yml'
      - 'tests/live-firebase-auth-browser-audit.cjs'
      - 'tests/firebase-authorized-domain-browser-audit.cjs'
      - 'tests/firebase-internal-error-recovery-browser-audit.cjs'
      - 'tests/firebase-provider-linking-browser-audit.cjs'
      - 'tests/firebase-direct-google-browser-audit.cjs'
      - 'tests/credential-name-root-persistence-audit.mjs'
      - 'firebase-auth.js'
      - 'firebase-config.js'
      - 'certificate-name.js'
      - 'firebase-sync.js'
      - 'firestore.rules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-provider-safety:
    name: canonical-provider-safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate provider-safety probe syntax
        run: node --check tests/firebase-authorized-domain-browser-audit.cjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Probe canonical provider configuration and fail-safe UI
        run: |
          set -euo pipefail
          CM_CANONICAL_URL=https://sribyju.github.io/CapitalMastery/ node tests/firebase-authorized-domain-browser-audit.cjs

  primary-email-password:
    name: primary-email-password
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate audit syntax and identity contract
        run: |
          set -euo pipefail
          node --check firebase-auth.js
          node --check certificate-name.js
          node --check firebase-sync.js
          node --check tests/live-firebase-auth-browser-audit.cjs
          node --check tests/firebase-internal-error-recovery-browser-audit.cjs
          node --check tests/firebase-provider-linking-browser-audit.cjs
          node --check tests/firebase-direct-google-browser-audit.cjs
          node tests/auth-assessment-hang-audit.mjs
          node tests/credential-name-root-persistence-audit.mjs
          node tests/deployable-encoding-audit.mjs

      - name: Wait for repaired GitHub Pages generation
        run: |
          set -euo pipefail
          ready=false
          for i in {1..60}; do
            curl -fsS "https://sribyju.github.io/CapitalMastery/?sha=${GITHUB_SHA}&attempt=${i}" -o /tmp/live-index.html || true
            curl -fsS "https://sribyju.github.io/CapitalMastery/certificate-name.js?sha=${GITHUB_SHA}&attempt=${i}" -o /tmp/live-certificate-name.js || true
            curl -fsS "https://sribyju.github.io/CapitalMastery/firebase-sync.js?sha=${GITHUB_SHA}&attempt=${i}" -o /tmp/live-firebase-sync.js || true
            if grep -Fq 'certificate-name.js?v=20260902-a11ysecurity1' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'firebase-auth.js?v=20260902-directgoogle1' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'firebase-sync.js?v=20260831-phase2rc7' /tmp/live-index.html 2>/dev/null \
              && grep -Fq 'settleProgressAfterIdentity' /tmp/live-certificate-name.js 2>/dev/null \
              && grep -Fq 'verifiedAfterAmbiguousWrite' /tmp/live-certificate-name.js 2>/dev/null \
              && grep -Fq 'identityIncompleteAtStart' /tmp/live-firebase-sync.js 2>/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'GitHub Pages primary did not converge to the current credential-identity generation'; exit 1; }
          echo 'GitHub Pages current credential-identity generation: PASS'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove Firebase internal-error recovery behavior
        run: |
          node tools/build-pages.mjs
          python3 -m http.server 4173 --directory dist-pages >/tmp/cm-auth-recovery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/firebase-internal-error-recovery-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/firebase-provider-linking-browser-audit.cjs
          CM_AUDIT_URL=http://127.0.0.1:4173 node tests/firebase-direct-google-browser-audit.cjs

      - name: Disposable real Firebase email/password lifecycle on live primary
        run: |
          set -euo pipefail
          CM_AUDIT_URL=https://sribyju.github.io/CapitalMastery/ node tests/live-firebase-auth-browser-audit.cjs
