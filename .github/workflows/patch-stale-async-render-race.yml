name: Patch stale async render race

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-stale-async-render-race.mjs'
      - '.github/workflows/patch-stale-async-render-race.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded product patch
        run: |
          set -euo pipefail
          node tools/patch-stale-async-render-race.mjs
          node --check capital-mastery-live-ui.js
          node --check training-tracks.js
          git diff --check
      - name: Commit product fix
        run: |
          set -euo pipefail
          if git diff --quiet -- capital-mastery-live-ui.js training-tracks.js; then
            echo 'Patch produced no product changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capital-mastery-live-ui.js training-tracks.js
          git commit -m 'Prevent stale async route repaint'
          git push origin HEAD:main
